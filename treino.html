<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RIQUE — Treino</title>
<style>
*{box-sizing:border-box;margin:0;padding:0} :root{--bg:#080808;--card:#111;--border:#272727;--muted:#777;--green:#72d685;--yellow:#d9c86c} html{scroll-behavior:smooth} body{background:radial-gradient(circle at 80% 0%,#171717 0%,var(--bg) 40%);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}.container{width:min(1050px,calc(100% - 40px));margin:auto;padding:30px 0 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px}.logo{font-size:25px;font-weight:900;letter-spacing:4px}.dashboard{color:var(--muted);text-decoration:none;font-size:13px}.dashboard:hover{color:#fff}.titulo{margin-bottom:35px}.titulo small{color:#666;font-size:10px;letter-spacing:3px}.titulo h1{font-size:clamp(50px,8vw,85px);line-height:.9;margin-top:12px;letter-spacing:-3px}.semana{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card,.bloco,.registro,.detalhes-header{background:var(--card);border:1px solid var(--border);border-radius:20px}.card{padding:25px;cursor:pointer;transition:.3s}.card:hover{transform:translateY(-5px);border-color:#444}.card h2{font-size:19px;margin-bottom:10px}.card p{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:18px}.intensidade{color:#999;font-size:10px;letter-spacing:1.5px}.card.hoje{border-color:#fff;box-shadow:0 0 0 1px #fff}.card.hoje:before{content:'🔥 TREINO DE HOJE';float:right;background:#fff;color:#000;padding:6px 10px;border-radius:0 19px 0 10px;font-size:9px;font-weight:bold}.card.concluido{background:#101b13;border-color:#315e39}.card.concluido:after{content:'✓ CONCLUÍDO';float:right;color:var(--green);font-size:10px;font-weight:bold}.detalhes{display:none;margin-top:30px}.detalhes.ativo{display:block}.detalhes-header{padding:30px;margin-bottom:18px}.detalhes-header h2{font-size:27px;margin-bottom:10px}.detalhes-header p{color:var(--muted);font-size:14px;line-height:1.5}.aviso{margin-top:20px;padding:15px;background:#211d0e;border:1px solid #4a421c;border-radius:13px;color:var(--yellow);font-size:13px;line-height:1.5}.bloco{padding:25px;margin-bottom:15px}.bloco h3,.registro h3{font-size:14px;letter-spacing:1px;margin-bottom:18px}.exercicio{display:grid;grid-template-columns:35px 1fr auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #242424}.exercicio:last-child{border:0}.check{width:23px;height:23px;border-radius:7px;border:1px solid #444;background:#151515;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent}.exercicio.feito .check{background:var(--green);border-color:var(--green);color:#07100a}.exercicio.feito .nome-exercicio{color:#666;text-decoration:line-through}.nome-exercicio{font-size:14px}.serie{color:var(--muted);font-size:12px;white-space:nowrap}.registro{padding:28px;margin-top:18px}.campos{display:grid;grid-template-columns:1fr 1fr;gap:15px}.campo{display:flex;flex-direction:column;gap:8px}.campo label{color:var(--muted);font-size:10px;letter-spacing:1px}.campo input,.campo textarea,.campo select{width:100%;background:var(--bg);color:#fff;border:1px solid #292929;border-radius:10px;padding:12px;outline:0;font-family:inherit}.campo textarea{min-height:90px;resize:vertical}.campo-completo{grid-column:1/-1}.botao-concluir{width:100%;border:0;border-radius:13px;padding:17px;margin-top:18px;background:#fff;color:#000;font-size:13px;font-weight:bold;cursor:pointer}.botao-concluir.concluido{background:#315e39;color:var(--green)}.mensagem-sucesso{display:none;margin-top:15px;padding:14px;background:#101b13;border:1px solid #315e39;color:var(--green);border-radius:11px;font-size:13px;text-align:center}.mensagem-sucesso.ativa{display:block}@media(max-width:700px){.container{width:calc(100% - 28px)}.semana{grid-template-columns:1fr}}@media(max-width:550px){.campos{grid-template-columns:1fr}.campo-completo{grid-column:auto}.exercicio{grid-template-columns:32px 1fr}.serie{grid-column:2}}
</style>
</head>
<body><div class="container">
<header><div class="logo">RIQUE</div><a href="index.html" class="dashboard">← Dashboard</a></header>
<section class="titulo"><small>PLANEJAMENTO SEMANAL</small><h1>TREINOS.</h1></section>
<section class="semana" id="semana"></section>
<section class="detalhes" id="detalhes"><div class="detalhes-header"><h2 id="tituloTreino"></h2><p id="descricaoTreino"></p><div class="aviso" id="avisoTreino"></div></div><div id="blocosTreino"></div><section class="registro"><h3>REGISTRAR TREINO</h3><div class="campos"><div class="campo"><label>RPE — ESFORÇO DE 1 A 10</label><select id="rpe"><option value="">Selecione</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div><div class="campo"><label>DURAÇÃO — MINUTOS</label><input id="duracao" type="number" min="1" max="300" placeholder="Ex.: 45"></div><div class="campo campo-completo"><label>OBSERVAÇÕES</label><textarea id="observacoes" placeholder="Como foi o treino?"></textarea></div></div><button class="botao-concluir" id="botaoConcluir" onclick="concluirTreino()">✓ MARCAR TREINO COMO CONCLUÍDO</button><div class="mensagem-sucesso" id="mensagemSucesso">✓ Treino registrado com sucesso!</div></section></section></div>
<script>
const treinos={segunda:{titulo:'💪 Superiores A + Core',descricao:'Força e definição dos membros superiores.',exercicios:[['Flexão de braço','3 × 8–15'],['Remada com elástico','3 × 12–15'],['Desenvolvimento de ombros','3 × 10–15'],['Elevação lateral','3 × 12–15'],['Prancha','3 × 30–45 segundos']]},terca:{titulo:'🦵 Joelho + Pernas',descricao:'Fortalecimento controlado.',aviso:'⚠️ Pare se houver aumento claro da dor no joelho.',exercicios:[['Ponte de glúteo','3 × 12–15'],['Abdução de quadril','3 × 15 por lado'],['Elevação de panturrilha','3 × 15–20'],['Agachamento até banco','3 × 8–12']]},quarta:{titulo:'🧘 Ativo + Mobilidade',descricao:'Recuperação e mobilidade.',exercicios:[['Caminhada leve','10–20 minutos'],['Mobilidade do tornozelo','2 × 10 por lado'],['Mobilidade do quadril','2 × 10 por lado']]},quinta:{titulo:'💪 Superiores B + Core',descricao:'Segundo treino de superiores.',exercicios:[['Flexão inclinada','3 × 10'],['Remada unilateral','3 × 12 por lado'],['Face pull','3 × 12–15'],['Dead bug','3 × 10 por lado']]},sexta:{titulo:'🦵 Pernas + Glúteos',descricao:'Fortalecimento sem agravar o joelho.',exercicios:[['Ponte de glúteo','3 × 15'],['Stiff com peso','3 × 10–12'],['Elevação de panturrilha','3 × 15–20']]},sabado:{titulo:'🏃 Condicionamento + Corpo inteiro',descricao:'Condicionamento sem corrida.',exercicios:[['Shadow boxing sem deslocamento','4 × 2 minutos'],['Flexão inclinada','3 × 10'],['Ponte de glúteo','3 × 15']]},domingo:{titulo:'😴 Descanso',descricao:'Dia de recuperação.',exercicios:[['Descanso','Livre'],['Mobilidade leve','5–10 minutos']]}};
const nomes={segunda:'💪 Superiores A + Core',terca:'🦵 Joelho + Pernas',quarta:'🧘 Ativo + Mobilidade',quinta:'💪 Superiores B + Core',sexta:'🦵 Pernas + Glúteos',sabado:'🏃 Condicionamento + Corpo inteiro',domingo:'😴 Descanso'};let atual=null,feitos=[];const hoje=['domingo','segunda','terca','quarta','quinta','sexta','sabado'][new Date().getDay()];
function hist(){return JSON.parse(localStorage.getItem('historicoTreinos')||'[]')}function hojeFeito(d){return hist().some(x=>x.dia===d&&x.data===new Date().toISOString().slice(0,10))}function renderCards(){semana.innerHTML=Object.keys(treinos).map(d=>`<div class="card ${d===hoje?'hoje':''} ${hojeFeito(d)?'concluido':''}" onclick="abrirTreino('${d}')"><h2>${nomes[d]}</h2><p>${treinos[d].descricao}</p><div class="intensidade">${d==='quarta'||d==='domingo'?'LEVE':'MODERADA'}</div></div>`).join('')}
function abrirTreino(d){atual=d;feitos=[];let t=treinos[d];tituloTreino.textContent=t.titulo;descricaoTreino.textContent=t.descricao;avisoTreino.textContent=t.aviso||'';avisoTreino.style.display=t.aviso?'block':'none';blocosTreino.innerHTML='<div class="bloco"><h3>🔥 Exercícios</h3>'+t.exercicios.map((e,i)=>`<div class="exercicio" data-i="${i}"><div class="check" onclick="marcar(${i},event)">✓</div><div class="nome-exercicio">${e[0]}</div><div class="serie">${e[1]}</div></div>`).join('')+'</div>';detalhes.classList.add('ativo');atualizarBotao();detalhes.scrollIntoView({behavior:'smooth'})}
function marcar(i,e){e.stopPropagation();let x=document.querySelector(`[data-i="${i}"]`);feitos.includes(i)?(feitos=feitos.filter(v=>v!==i),x.classList.remove('feito')):(feitos.push(i),x.classList.add('feito'))}function concluirTreino(){if(!atual)return;let h=hist().filter(x=>!(x.dia===atual&&x.data===new Date().toISOString().slice(0,10)));h.push({dia:atual,data:new Date().toISOString().slice(0,10),rpe:rpe.value,duracao:duracao.value,observacoes:observacoes.value,exercicios:feitos});localStorage.setItem('historicoTreinos',JSON.stringify(h));mensagemSucesso.classList.add('ativa');renderCards();atualizarBotao()}function atualizarBotao(){botaoConcluir.classList.toggle('concluido',hojeFeito(atual));botaoConcluir.textContent=hojeFeito(atual)?'✓ TREINO REGISTRADO HOJE':'✓ MARCAR TREINO COMO CONCLUÍDO'}renderCards();
</script></body></html>
