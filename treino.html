<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Treino</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #08090b;
            --card: #111318;
            --card2: #171a20;
            --border: rgba(255,255,255,0.08);
            --text: #f5f5f5;
            --muted: #858b96;
            --green: #39ff88;
            --green-dark: #1bc765;
            --red: #ff4d67;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(57,255,136,0.08),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            min-height: 100vh;

            padding-bottom: 50px;

        }


        .container {

            width:
                min(
                    900px,
                    calc(100% - 30px)
                );

            margin:
                0 auto;

        }


        /* HEADER */

        header {

            padding:
                25px 0;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

        }


        .logo {

            font-size:
                24px;

            font-weight:
                900;

            letter-spacing:
                4px;

        }


        .header-sub {

            color:
                var(--muted);

            font-size:
                10px;

            letter-spacing:
                2px;

            margin-top:
                4px;

        }


        .back-button {

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,0.04);

            color:
                var(--text);

            padding:
                10px 14px;

            border-radius:
                10px;

            cursor:
                pointer;

            transition:
                0.2s;

        }


        .back-button:hover {

            transform:
                translateY(-2px);

            border-color:
                rgba(57,255,136,0.3);

        }


        /* HERO */

        .hero {

            padding:
                30px;

            border:
                1px solid var(--border);

            border-radius:
                22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(57,255,136,0.08),
                    rgba(255,255,255,0.02)
                );

            animation:
                fadeUp 0.5s ease;

        }


        .day-label {

            color:
                var(--green);

            font-size:
                11px;

            font-weight:
                bold;

            letter-spacing:
                3px;

        }


        .hero h1 {

            font-size:
                clamp(
                    30px,
                    6vw,
                    52px
                );

            margin-top:
                8px;

            line-height:
                1;

        }


        .hero-date {

            color:
                var(--muted);

            font-size:
                13px;

            margin-top:
                12px;

        }


        /* NAV DIAS */

        .day-navigation {

            display:
                grid;

            grid-template-columns:
                repeat(7, 1fr);

            gap:
                7px;

            margin-top:
                15px;

        }


        .day-nav {

            border:
                1px solid var(--border);

            background:
                var(--card);

            color:
                var(--muted);

            padding:
                10px 4px;

            border-radius:
                10px;

            cursor:
                pointer;

            font-size:
                10px;

            font-weight:
                bold;

            transition:
                0.2s;

        }


        .day-nav:hover {

            color:
                var(--text);

            border-color:
                rgba(57,255,136,0.25);

        }


        .day-nav.active {

            color:
                #06100a;

            background:
                var(--green);

            border-color:
                var(--green);

        }


        /* TREINO */

        .section {

            margin-top:
                20px;

        }


        .section-title {

            font-size:
                13px;

            text-transform:
                uppercase;

            letter-spacing:
                2px;

            margin-bottom:
                12px;

        }


        .exercise-list {

            display:
                flex;

            flex-direction:
                column;

            gap:
                10px;

        }


        .exercise {

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius:
                15px;

            padding:
                17px;

            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            transition:
                0.2s;

        }


        .exercise:hover {

            border-color:
                rgba(57,255,136,0.2);

        }


        .exercise.done {

            border-color:
                rgba(57,255,136,0.25);

            background:
                rgba(57,255,136,0.05);

        }


        .exercise-check {

            width:
                25px;

            height:
                25px;

            border:
                1px solid rgba(255,255,255,0.2);

            border-radius:
                7px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            flex-shrink:
                0;

            color:
                transparent;

            transition:
                0.2s;

        }


        .exercise.done
        .exercise-check {

            background:
                var(--green);

            border-color:
                var(--green);

            color:
                #06100a;

        }


        .exercise-info {

            flex:
                1;

        }


        .exercise-name {

            font-size:
                14px;

            font-weight:
                bold;

        }


        .exercise-details {

            color:
                var(--muted);

            font-size:
                11px;

            margin-top:
                5px;

        }


        /* REST */

        .rest-card {

            text-align:
                center;

            padding:
                45px 25px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius:
                18px;

        }


        .rest-icon {

            font-size:
                45px;

        }


        .rest-card h2 {

            margin-top:
                15px;

        }


        .rest-card p {

            color:
                var(--muted);

            margin-top:
                8px;

            font-size:
                13px;

        }


        /* FORM */

        .form-card {

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius:
                18px;

            padding:
                22px;

        }


        .form-group {

            margin-bottom:
                17px;

        }


        .form-group label {

            display:
                block;

            color:
                var(--muted);

            font-size:
                11px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

            margin-bottom:
                8px;

        }


        .form-group input,
        .form-group textarea {

            width:
                100%;

            background:
                #0b0d10;

            color:
                white;

            border:
                1px solid var(--border);

            border-radius:
                10px;

            padding:
                12px;

            outline:
                none;

            font-family:
                inherit;

        }


        .form-group textarea {

            min-height:
                100px;

            resize:
                vertical;

        }


        .form-group input:focus,
        .form-group textarea:focus {

            border-color:
                rgba(57,255,136,0.4);

        }


        .rpe-row {

            display:
                grid;

            grid-template-columns:
                repeat(10, 1fr);

            gap:
                5px;

        }


        .rpe-button {

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,0.03);

            color:
                var(--muted);

            padding:
                9px 2px;

            border-radius:
                7px;

            cursor:
                pointer;

            font-size:
                11px;

        }


        .rpe-button:hover {

            border-color:
                rgba(57,255,136,0.3);

        }


        .rpe-button.active {

            background:
                var(--green);

            color:
                #06100a;

            border-color:
                var(--green);

            font-weight:
                bold;

        }


        /* SAVE */

        .save-button {

            width:
                100%;

            padding:
                16px;

            border:
                none;

            border-radius:
                12px;

            background:
                var(--green);

            color:
                #06100a;

            font-weight:
                900;

            cursor:
                pointer;

            transition:
                0.2s;

            font-size:
                13px;

            letter-spacing:
                0.5px;

        }


        .save-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(57,255,136,0.15);

        }


        .save-button:disabled {

            opacity:
                0.6;

            cursor:
                wait;

        }


        /* STATUS */

        .status {

            margin-top:
                15px;

            padding:
                13px;

            border:
                1px solid var(--border);

            border-radius:
                10px;

            font-size:
                12px;

            display:
                none;

        }


        .status.visible {

            display:
                block;

        }


        .status.success {

            color:
                var(--green);

            border-color:
                rgba(57,255,136,0.25);

        }


        .status.error {

            color:
                #ff7185;

            border-color:
                rgba(255,77,103,0.25);

        }


        /* LOGIN */

        #loginScreen {

            position:
                fixed;

            inset:
                0;

            z-index:
                9999;

            background:
                #08090b;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

        }


        .login-box {

            width:
                min(420px, 100%);

            padding:
                35px;

            border:
                1px solid var(--border);

            border-radius:
                22px;

            background:
                var(--card);

        }


        .login-logo {

            color:
                var(--green);

            font-size:
                13px;

            letter-spacing:
                4px;

            font-weight:
                bold;

        }


        .login-box h2 {

            font-size:
                30px;

            margin-top:
                10px;

        }


        .login-box p {

            color:
                var(--muted);

            font-size:
                13px;

            line-height:
                1.5;

            margin:
                8px 0 22px;

        }


        .login-box input {

            width:
                100%;

            padding:
                13px;

            margin-bottom:
                10px;

            background:
                #0b0d10;

            color:
                white;

            border:
                1px solid var(--border);

            border-radius:
                10px;

            outline:
                none;

        }


        .login-button {

            width:
                100%;

            padding:
                14px;

            border:
                none;

            border-radius:
                10px;

            background:
                var(--green);

            color:
                #06100a;

            font-weight:
                900;

            cursor:
                pointer;

        }


        .login-error {

            color:
                #ff7185;

            font-size:
                12px;

            margin-top:
                10px;

            display:
                none;

        }


        #loadingScreen {

            position:
                fixed;

            inset:
                0;

            z-index:
                9998;

            background:
                var(--bg);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

        }


        .loader {

            width:
                42px;

            height:
                42px;

            border:
                3px solid rgba(255,255,255,0.08);

            border-top-color:
                var(--green);

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes fadeUp {

            from {

                opacity:
                    0;

                transform:
                    translateY(15px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        @media (max-width: 600px) {

            .container {

                width:
                    min(
                        100% - 20px,
                        900px
                    );

            }


            .hero {

                padding:
                    24px;

            }


            .day-navigation {

                gap:
                    4px;

            }


            .day-nav {

                padding:
                    9px 2px;

                font-size:
                    9px;

            }


            .rpe-row {

                grid-template-columns:
                    repeat(5, 1fr);

                gap:
                    7px;

            }

        }

    </style>

</head>

                {
                    nome: "Rosca martelo",
                    detalhes: "3 séries × 10–15 repetições"
                },

                {
                    nome: "Tríceps acima da cabeça",
                    detalhes: "3 séries × 10–15 repetições"
                },

                {
                    nome: "Abdominal bicicleta",
                    detalhes: "3 séries × 15–20 repetições"
                }

            ],


            sexta: [

                {
                    nome: "Agachamento",
                    detalhes: "4 séries × 8–12 repetições"
                },

                {
                    nome: "Levantamento terra romeno",
                    detalhes: "3 séries × 10–12 repetições"
                },

                {
                    nome: "Afundo reverso",
                    detalhes: "3 séries × 8–12 cada perna"
                },

                {
                    nome: "Elevação pélvica",
                    detalhes: "4 séries × 10–15 repetições"
                },

                {
                    nome: "Abdução com mini band",
                    detalhes: "3 séries × 15–20 repetições"
                },

                {
                    nome: "Panturrilha",
                    detalhes: "4 séries × 15–20 repetições"
                }

            ],


            sabado: [

                {
                    nome: "Aquecimento",
                    detalhes: "5–10 minutos"
                },

                {
                    nome: "Polichinelos",
                    detalhes: "3 séries × 30–45 segundos"
                },

                {
                    nome: "Mountain climbers",
                    detalhes: "3 séries × 30–45 segundos"
                },

                {
                    nome: "Agachamento",
                    detalhes: "3 séries × 15 repetições"
                },

                {
                    nome: "Flexão",
                    detalhes: "3 séries × 8–15 repetições"
                },

                {
                    nome: "Prancha",
                    detalhes: "3 séries × 30–60 segundos"
                }

            ]

        };


        /* ==================================
           ESTADO
        ================================== */

        let usuarioAtual = null;

        let diaSelecionado = null;

        let rpeSelecionado = null;

        let registroAtual = null;


        /* ==================================
           DATA
        ================================== */

        function dataISO(
            data = new Date()
        ) {

            const ano =
                data.getFullYear();

            const mes =
                String(
                    data.getMonth() + 1
                ).padStart(2, "0");

            const dia =
                String(
                    data.getDate()
                ).padStart(2, "0");

            return `${ano}-${mes}-${dia}`;

        }


        function chaveDia(
            data = new Date()
        ) {

            const chaves = [

                "domingo",
                "segunda",
                "terca",
                "quarta",
                "quinta",
                "sexta",
                "sabado"

            ];

            return chaves[data.getDay()];

        }


        function formatarData(data) {

            const partes =
                data.split("-");

            if (
                partes.length !== 3
            ) {
                return data;
            }

            return `${partes[2]}/${partes[1]}/${partes[0]}`;

        }


        /* ==================================
           LOGIN
        ================================== */

        async function fazerLogin() {

            const email =
                document.getElementById(
                    "email"
                ).value.trim();

            const password =
                document.getElementById(
                    "password"
                ).value;

            const erro =
                document.getElementById(
                    "loginError"
                );


            erro.style.display =
                "none";


            if (
                !email ||
                !password
            ) {

                erro.textContent =
                    "Preencha o e-mail e a senha.";

                erro.style.display =
                    "block";

                return;

            }


            const { data, error } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email,
                        password

                    });


            if (error) {

                console.error(error);

                erro.textContent =
                    "E-mail ou senha incorretos.";

                erro.style.display =
                    "block";

                return;

            }


            usuarioAtual =
                data.user;


            await iniciarAplicacao();

        }


        async function verificarSessao() {

            const { data } =
                await supabaseClient.auth
                    .getSession();


            if (data.session) {

                usuarioAtual =
                    data.session.user;

                await iniciarAplicacao();

            } else {

                mostrarLogin();

            }

        }


        function mostrarLogin() {

            document.getElementById(
                "loadingScreen"
            ).style.display =
                "none";


            document.getElementById(
                "app"
            ).style.display =
                "none";


            document.getElementById(
                "loginScreen"
            ).style.display =
                "flex";

        }


        /* ==================================
           INICIALIZAÇÃO
        ================================== */

        async function iniciarAplicacao() {

            document.getElementById(
                "loginScreen"
            ).style.display =
                "none";


            document.getElementById(
                "loadingScreen"
            ).style.display =
                "flex";


            /*
               PRIMEIRO:
               descobre qual dia deve abrir.
            */

            const parametros =
                new URLSearchParams(
                    window.location.search
                );


            const diaURL =
                parametros.get("dia");


            const diasValidos = [

                "domingo",
                "segunda",
                "terca",
                "quarta",
                "quinta",
                "sexta",
                "sabado"

            ];


            if (
                diaURL &&
                diasValidos.includes(
                    diaURL
                )
            ) {

                diaSelecionado =
                    diaURL;

            } else {

                diaSelecionado =
                    chaveDia();

            }


            await carregarRegistro();

            renderizarTreino();


            document.getElementById(
                "loadingScreen"
            ).style.display =
                "none";


            document.getElementById(
                "app"
            ).style.display =
                "block";

        }


        /* ==================================
           SELECIONAR DIA
        ================================== */

        async function selecionarDia(
            dia
        ) {

            diaSelecionado =
                dia;


            /*
               Atualiza a URL.
               Isso permite voltar/recarregar
               e continuar no mesmo treino.
            */

            window.history.replaceState(
                {},
                "",
                `treino.html?dia=${dia}`
            );


            rpeSelecionado = null;

            registroAtual = null;


            limparFormulario();


            await carregarRegistro();

            renderizarTreino();

        }


        /* ==================================
           RENDERIZAR TREINO
        ================================== */

        function renderizarTreino() {

            document.getElementById(
                "diaLabel"
            ).textContent =
                nomesDias[diaSelecionado];


            document.getElementById(
                "nomeTreino"
            ).textContent =
                nomesTreinos[diaSelecionado];


            document.getElementById(
                "dataTreino"
            ).textContent =
                `Data de registro: ${formatarData(dataISO())}`;


            document
                .querySelectorAll(".day-nav")
                .forEach(
                    botao => {

                        botao.classList.toggle(
                            "active",
                            botao.dataset.dia ===
                            diaSelecionado
                        );

                    }
                );


            if (
                diaSelecionado ===
                "domingo"
            ) {

                mostrarDescanso();

                return;

            }


            document.getElementById(
                "formSection"
            ).style.display =
                "block";


            renderizarExercicios();

            preencherRegistro();

        }


        /* ==================================
           EXERCÍCIOS
        ================================== */

        function renderizarExercicios() {

            const lista =
                document.getElementById(
                    "exerciseList"
                );


            lista.innerHTML = "";


            const exercicios =
                treinos[diaSelecionado] || [];


            exercicios.forEach(
                (exercicio, index) => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "exercise";


                    div.dataset.index =
                        index;


                    div.innerHTML = `

                        <div
                            class="exercise-check"
                            onclick="toggleExercicio(${index})"
                        >
                            ✓
                        </div>

                        <div class="exercise-info">

                            <div class="exercise-name">
                                ${exercicio.nome}
                            </div>

                            <div class="exercise-details">
                                ${exercicio.detalhes}
                            </div>

                        </div>

                    `;


                    lista.appendChild(div);

                }
            );

        }


        function toggleExercicio(index) {

            const exercicio =
                document.querySelector(
                    `.exercise[data-index="${index}"]`
                );


            if (!exercicio) {
                return;
            }


            exercicio.classList.toggle(
                "done"
            );

        }


        /* ==================================
           DESCANSO
        ================================== */

        function mostrarDescanso() {

            document.getElementById(
                "exerciseList"
            ).innerHTML = `

                <div class="rest-card">

                    <div class="rest-icon">
                        😴
                    </div>

                    <h2>
                        Dia de descanso
                    </h2>

                    <p>
                        Recuperação também faz parte
                        do treino.
                    </p>

                </div>

            `;


            document.getElementById(
                "formSection"
            ).style.display =
                "none";

        }


        /* ==================================
           RPE
        ================================== */

        function selecionarRPE(
            valor
        ) {

            rpeSelecionado =
                valor;


            document
                .querySelectorAll(
                    ".rpe-button"
                )
                .forEach(
                    botao => {

                        botao.classList.toggle(
                            "active",
                            Number(
                                botao.dataset.rpe
                            ) === valor
                        );

                    }
                );

        }


        /* ==================================
           SUPABASE — REGISTRO
        ================================== */

        async function carregarRegistro() {

            if (!usuarioAtual) {
                return;
            }


            const hoje =
                dataISO();


            const { data, error } =
                await supabaseClient
                    .from("Treinos")
                    .select("*")
                    .eq(
                        "user_id",
                        usuarioAtual.id
                    )
                    .eq(
                        "dia",
                        diaSelecionado
                    )
                    .eq(
                        "data",
                        hoje
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "Erro ao carregar registro:",
                    error
                );

                registroAtual = null;

                return;

            }


            registroAtual =
                data || null;

        }


        /* ==================================
           PREENCHER REGISTRO
        ================================== */

        function preencherRegistro() {

            if (!registroAtual) {
                return;
            }


            if (
                registroAtual.rpe !== null &&
                registroAtual.rpe !== undefined
            ) {

                selecionarRPE(
                    Number(
                        registroAtual.rpe
                    )
                );

            }


            if (
                registroAtual.duracao !== null &&
                registroAtual.duracao !== undefined
            ) {

                document.getElementById(
                    "duracao"
                ).value =
                    registroAtual.duracao;

            }


            if (
                registroAtual.observacoes
            ) {

                document.getElementById(
                    "observacoes"
                ).value =
                    registroAtual.observacoes;

            }


            if (
                Array.isArray(
                    registroAtual.exercicios
                )
            ) {

                registroAtual.exercicios
                    .forEach(
                        (feito, index) => {

                            if (!feito) {
                                return;
                            }


                            const elemento =
                                document.querySelector(
                                    `.exercise[data-index="${index}"]`
                                );


                            if (elemento) {

                                elemento.classList.add(
                                    "done"
                                );

                            }

                        }
                    );

            }

        }


        /* ==================================
           LIMPAR FORMULÁRIO
        ================================== */

        function limparFormulario() {

            rpeSelecionado = null;

            document.getElementById(
                "duracao"
            ).value = "";


            document.getElementById(
                "observacoes"
            ).value = "";


            document
                .querySelectorAll(
                    ".rpe-button"
                )
                .forEach(
                    botao => {

                        botao.classList.remove(
                            "active"
                        );

                    }
                );

        }


        /* ==================================
           SALVAR TREINO
        ================================== */

        async function salvarTreino() {

            if (!usuarioAtual) {

                mostrarStatus(
                    "Você precisa estar logado.",
                    "error"
                );

                return;

            }


            if (
                diaSelecionado ===
                "domingo"
            ) {

                return;

            }


            const botao =
                document.getElementById(
                    "saveButton"
                );


            botao.disabled =
                true;


            botao.textContent =
                "SINCRONIZANDO...";


            const exercicios =
                Array.from(
                    document.querySelectorAll(
                        ".exercise"
                    )
                ).map(
                    elemento =>
                        elemento.classList.contains(
                            "done"
                        )
                );


            const duracao =
                document.getElementById(
                    "duracao"
                ).value;


            const observacoes =
                document.getElementById(
                    "observacoes"
                ).value;


            const dados = {

                user_id:
                    usuarioAtual.id,

                dia:
                    diaSelecionado,

                data:
                    dataISO(),

                horario:
                    new Date()
                        .toLocaleTimeString(
                            "pt-BR",
                            {
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        ),

                rpe:
                    rpeSelecionado,

                duracao:
                    duracao
                    ? Number(duracao)
                    : null,

                observacoes:
                    observacoes || null,

                exercicios:
                    exercicios

            };


            let resultado;


            /*
               Se já existe registro hoje,
               atualiza.

               Se não existe,
               cria.
            */

            if (registroAtual) {

                resultado =
                    await supabaseClient
                        .from("Treinos")
                        .update(dados)
                        .eq(
                            "id",
                            registroAtual.id
                        )
                        .eq(
                            "user_id",
                            usuarioAtual.id
                        )
                        .select()
                        .single();

            } else {

                resultado =
                    await supabaseClient
                        .from("Treinos")
                        .insert(dados)
                        .select()
                        .single();

            }


            const {
                data,
                error
            } = resultado;


            if (error) {

                console.error(
                    "Erro ao salvar:",
                    error
                );


                mostrarStatus(
                    "Erro ao sincronizar. Verifique o console.",
                    "error"
                );


                botao.disabled =
                    false;


                botao.textContent =
                    "✓ CONCLUIR E SINCRONIZAR TREINO";


                return;

            }


            registroAtual =
                data;


            mostrarStatus(
                "✓ Treino salvo na nuvem!",
                "success"
            );


            botao.disabled =
                false;


            botao.textContent =
                "✓ TREINO SINCRONIZADO";

        }


        /* ==================================
           STATUS
        ================================== */

        function mostrarStatus(
            mensagem,
            tipo
        ) {

            const status =
                document.getElementById(
                    "status"
                );


            status.textContent =
                mensagem;


            status.className =
                "status visible";


            if (tipo) {

                status.classList.add(
                    tipo
                );

            }


            setTimeout(
                () => {

                    status.classList.remove(
                        "visible"
                    );

                },
                4000
            );

        }


        /* ==================================
           DASHBOARD
        ================================== */

        function voltarDashboard() {

            window.location.href =
                "index.html";

        }


        /* ==================================
           ENTER LOGIN
        ================================== */

        document.getElementById(
            "password"
        ).addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    fazerLogin();

                }

            }
        );


        /* ==================================
           AUTH
        ================================== */

        supabaseClient.auth.onAuthStateChange(
            async (event) => {

                if (
                    event === "SIGNED_OUT"
                ) {

                    mostrarLogin();

                }

            }
        );


        /* ==================================
           INICIAR
        ================================== */

        verificarSessao();

    </script>
